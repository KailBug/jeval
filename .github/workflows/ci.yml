name: Desktop and engine
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run dist:win
      - run: npm run test:storage
        env:
          JEVAL_STORAGE_EXECUTABLE: release/win-unpacked/resources/engine/jeval-engine.exe
      - run: node --import tsx --test tests/integration/checkpoint-update.test.ts
        env:
          JEVAL_CHECKPOINT_EXECUTABLE: release/win-unpacked/resources/engine/jeval-engine.exe
      - run: node --import tsx --test tests/integration/full-content.test.ts
        env:
          JEVAL_CONTENT_EXECUTABLE: release/win-unpacked/resources/engine/jeval-engine.exe
      - run: node --import tsx --test tests/integration/source-audit.test.ts
        env:
          JEVAL_AUDIT_EXECUTABLE: release/win-unpacked/resources/engine/jeval-engine.exe
      - name: Validate packaged library scale
        run: node --import tsx scripts/validation/library-scale.ts target .local/library-scale.json
        env:
          JEVAL_PACKAGED_EXECUTABLE: release/win-unpacked/jeval.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-scale-evidence
          path: .local/library-scale.json
          if-no-files-found: ignore
      - run: npm run test:e2e
        env:
          JEVAL_PACKAGED_EXECUTABLE: release/win-unpacked/jeval.exe
      - name: Install and verify NSIS payload
        id: install
        run: pwsh -NoProfile -File scripts/validation/windows-installation.ps1 -Action Install
      - name: Test installed desktop
        run: npm run test:e2e
        env:
          JEVAL_PACKAGED_EXECUTABLE: .local/windows-installation/中文 安装/jeval.exe
          JEVAL_AUDIT_EXECUTABLE: .local/windows-installation/中文 安装/resources/engine/jeval-engine.exe
      - name: Uninstall test copy
        if: always() && steps.install.outcome == 'success'
        run: pwsh -NoProfile -File scripts/validation/windows-installation.ps1 -Action Uninstall
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: windows-installation-evidence
          path: .local/windows-installation/installation.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results
          path: test-results/
